<html lang="uk">

<title>АгроТермінал</title>

<link rel="preload" as="image" href="field.jpg">

:root{

  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;font-family:var(--b);font-size:16px;line-height:1.55;color:var(--ink);background:var(--bg);

.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand img{width:48px;height:auto}
.brand b{font-family:var(--h);font-size:20px;letter-spacing:-.3px}
.brand b span{color:var(--leaf)}
.anon{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--leaf-d);background:var(--sprout);border:1px solid #CDE9C5;border-radius:999px;padding:8px 14px}
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;color:#fff;
  background:#3a4a1c url("field.jpg") center 60%/cover no-repeat;box-shadow:0 30px 60px -36px rgba(40,60,10,.6)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,8,.05) 0%,rgba(10,25,8,.25) 40%,rgba(10,25,8,.78) 100%)}
.hero .in{position:relative;padding:34px;display:flex;flex-direction:column;gap:14px;max-width:640px}
.hero h1{font-family:var(--h);font-size:40px;line-height:1.08;margin:0;letter-spacing:-.8px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--wheat)}
.hero p{margin:0;font-size:17px;color:#EEF4E8;max-width:52ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 40px -32px rgba(21,33,23,.45)}
.prog{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:#E6EEE2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#8BD35C);border-radius:99px;transition:width .5s ease}
.pl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--leaf-d);letter-spacing:.2px}
h2{font-family:var(--h);font-size:24px;margin:0;letter-spacing:-.3px;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:600;font-size:14px}
input[type=text],select{font:inherit;color:var(--ink);background:#FAFCF8;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,.opt:focus-within{outline:3px solid #A4DD93;outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
.err{margin:0;color:var(--bad);font-size:14px;min-height:1.2em}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:14px;padding:13px 24px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:transform .12s,background .12s}
button:hover{transform:translateY(-1px)}

.opt:hover{border-color:#BFDDB4}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .d{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #B9CDB2;margin-top:2px}
.opt.cb .d{border-radius:5px}
.opt:has(input:checked){border-color:var(--leaf);background:var(--sprout)}
.opt:has(input:checked) .d{border-color:var(--leaf);background:radial-gradient(circle,var(--leaf) 45%,transparent 50%)}
.opt.cb:has(input:checked) .d{background:var(--leaf)}

.s5 .opt b{font-family:var(--h);font-size:17px;color:var(--leaf-d)}
.res{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.ring{width:168px;height:168px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-family:var(--h);font-size:38px;line-height:1}
.ring small{color:var(--muted)}

.lv1{background:#FBE5DF;color:#922B17}.lv2{background:var(--wheat-l);color:#7A5808}.lv3{background:var(--sprout);color:var(--leaf-d)}.lv4{background:var(--leaf);color:#fff}
.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.tr{height:12px;background:#EEF3EB;border-radius:99px;overflow:hidden}
.tr i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#8BD35C);border-radius:99px}
.num{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;font-weight:600}
.box{display:flex;gap:12px;align-items:center;background:var(--sprout);border:1px solid #CDE9C5;border-radius:16px;padding:14px 16px}
.box.w{background:var(--wheat-l);border-color:#F0DFA8}
.idbox{font-family:var(--h);font-size:20px;letter-spacing:1px;color:var(--leaf-d)}
.code{font:12px Consolas,monospace;word-break:break-all;background:#FAFCF8;border:1.5px dashed var(--line);border-radius:12px;padding:12px;user-select:all}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl th{background:#F5F9F2}
.verdict{border-left:5px solid var(--leaf);background:var(--sprout);padding:10px 14px;border-radius:0 12px 12px 0}
.verdict.no{border-color:#C99A1E;background:var(--wheat-l)}
textarea{font:13px Consolas,monospace;width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#FAFCF8}
.chart svg{width:100%;height:auto}
footer{text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
footer a{color:var(--leaf-d)}
@media (max-width:640px){.hero{min-height:380px;border-radius:22px}.hero .in{padding:22px}.hero h1{font-size:28px}.card{padding:20px;border-radius:20px}.opts.s4,.opts.s5{grid-template-columns:repeat(2,1fr)}.opts.s5 .opt:last-child{grid-column:span 2}.res{grid-template-columns:1fr;justify-items:center}.br{grid-template-columns:96px 1fr 50px}.brand b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 ${AREAS.map((a,i)=>`<div class="q"><div class="qt"><span class="qn">${i+1}</span>${a}</div>${radios("s"+i,SC,S.self[i]==null?-1:S.self[i]-1,"s4")}</div>`).join("")}${navb()}</section>`}

function v5(){return `<section class="card">${prog()}<h2>Наостанок</h2>
 <div class="q"><div class="qt"><span class="qn">1</span>У техніці з’явилася нова система, якої ти не знаєш. Як будеш її опановувати?</div>${radios("r1",["Чекатиму, поки хтось покаже","Почитаю інструкцію, подивлюся відео виробника, спробую і спитаю, якщо не вийде","Не буду - мені й так нормально","Натискатиму все підряд"],-1)}</div>

 ${navb("Показати результат")}</section>`}
function b5(){$("#back").onclick=()=>go(4);$("#next").onclick=()=>{const a=val("r1"),p=$$("input[name=r2]:checked").map(x=>+x.value);if(a<0||!p.length){$("#e").textContent="Відповідай на обидва запитання.";return}S.refl={a,p};S.done=Date.now();S.sent=null;go(6)}}

function calc(){
 const m=MOT.reduce((s,q,i)=>s+(q[1]?6-S.mot[i]:S.mot[i]),0),M=(m-10)/40*25;
 const kq=KNOW.map((q,i)=>S.know[i]===q[2]?1:0),aq=ACT.map((q,i)=>S.act[i]===q[2]?1:0);
 const C=kq.reduce((a,b)=>a+b,0)/KNOW.length*25,D=aq.reduce((a,b)=>a+b,0)/ACT.length*25;
 const sn=(S.self.reduce((a,b)=>a+b,0)/5-1)/3,act=(C+D)/50,diff=sn-act,adq=15*Math.max(0,1-Math.abs(diff)/.5);
 const r1=S.refl.a===1?5:0,w=[[0,C],[1,D],[3,M]].sort((x,y)=>x[1]-y[1])[0][0],r2=S.refl.p.includes(w)?5:2;
 const r=x=>Math.round(x*10)/10;return {M:r(M),C:r(C),D:r(D),R:r(adq+r1+r2),T:r(M+C+D+adq+r1+r2),kq,aq,diff:r(diff*100)}}
const LV=t=>t<=40?1:t<=60?2:t<=80?3:4,LVN=["","Низький","Середній","Достатній","Високий"];
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s)));
const payload=R=>({v:3,id:S.id,g:S.group,e:S.stage,M:R.M,C:R.C,D:R.D,R:R.R,T:R.T,k:R.aq,s:S.self,q:R.kq,mt:S.mot,min:Math.max(1,Math.round((S.done-S.t0)/60000))});
function v6(){const R=calc(),L=LV(R.T);S.code="ЦК3."+b64(JSON.stringify(payload(R)));save();const C=2*Math.PI*70;
 const row=(n,v)=>`<div class="br"><span>${n}</span><div class="tr"><i style="width:${v/25*100}%"></i></div><span class="num">${f1(v)}/25</span></div>`;
 const tip=R.diff>15?"Ти оцінюєш себе трохи вище, ніж показали відповіді. Перевіряй себе на справжніх завданнях.":R.diff<-15?"Ти знаєш більше, ніж думаєш. Сміливіше берись за складне!":"Твоя самооцінка майже збіглася з відповідями - це корисна навичка.";
 return `<section class="card"><p class="eyebrow">Твій результат</p>
 <div class="res"><div class="ring"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" stroke="#EEF3EB" stroke-width="14" fill="none"/><circle cx="80" cy="80" r="70" stroke="#23A019" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-R.T/100)}"/></svg><div><b>${f1(R.T)}</b><small>зі 100</small></div></div>
 <div style="display:flex;flex-direction:column;gap:14px"><span class="lv lv${L}">${LVN[L]} рівень</span><div class="bars">${row("Ставлення",R.M)}${row("Знання",R.C)}${row("Дії",R.D)}${row("Самоаналіз",R.R)}</div></div></div>
 <p class="lead">${tip}</p><div id="sb"></div>
 <div class="box"><div><div class="hint">Твій анонімний код - збережи для повторного проходження</div><div class="idbox">${esc(S.id)}</div></div></div>
 <div class="nav"><span class="hint">Дякуємо за відповіді!</span><button id="again">Пройти ще раз</button></div></section>`}
async function b6(){$("#again").onclick=()=>{S.step=0;save();render()};const sb=$("#sb");
 const manual=t=>{sb.innerHTML=`<div class="box w"><div style="display:flex;flex-direction:column;gap:8px;width:100%"><b>${t}</b><div class="code" id="code">${S.code}</div><div><button id="cp">Копіювати код</button></div></div></div>`;
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(S.code);$("#cp").textContent="Скопійовано"}catch(e){const r=document.createRange();r.selectNodeContents($("#code"));getSelection().removeAllRanges();getSelection().addRange(r);$("#cp").textContent="Виділено - натисни Ctrl+C"}}};
 if(!ENDPOINT){sb.innerHTML="";return}
 if(S.sent===S.code){sb.innerHTML=`<div class="box">✓ Відповіді збережено анонімно</div>`;return}
 sb.innerHTML=`<div class="box">Зберігаємо відповіді…</div>`;
 try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload(calc()))});S.sent=S.code;save();sb.innerHTML=`<div class="box">✓ Відповіді збережено анонімно</div>`}catch(e){manual("Не вдалося надіслати автоматично. Надішли код викладачу:")}}

/* ---- панель викладача ---- */
function vT(){return `<section class="card"><p class="eyebrow">Закритий розділ</p><h2>Результати опитування</h2>
 <div class="grid2"><div class="f"><label class="lbl" for="key">Пароль</label><input type="password" id="key" autocomplete="current-password" style="font:inherit;background:#FAFCF8;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;width:100%"></div><div class="f" style="justify-content:flex-end"><button class="go" id="ld">Увійти</button></div></div>
 <div id="sel" hidden><div class="grid2"><div class="f"><label class="lbl" for="eg">Експериментальна група</label><select id="eg"></select></div><div class="f"><label class="lbl" for="kg">Контрольна група</label><select id="kg"></select></div></div></div>
 <div class="nav"><span class="hint" id="pi">${ENDPOINT?"Введи пароль, щоб побачити відповіді.":"Збереження відповідей ще не налаштовано."}</span><a href="#" style="color:var(--leaf-d)">До опитування</a></div><textarea id="codes" hidden></textarea></section><div id="rep" style="display:flex;flex-direction:column;gap:20px"></div>`}
let ROWS=[],SRV=[];
function parse(){const out=[...SRV],seen=new Set(out.map(o=>o.id+o.e));let bad=0;$("#codes").value.split(/\s+/).filter(x=>/^ЦК3\./.test(x)).forEach(l=>{try{const o=JSON.parse(unb64(l.slice(4)));if(seen.has(o.id+o.e))return;seen.add(o.id+o.e);out.push(o)}catch(e){bad++}});
 ROWS=out;const gs=[...new Set(out.map(o=>String(o.g)))].sort();["#eg","#kg"].forEach((s,i)=>{const c=$(s).value;$(s).innerHTML=gs.map(g=>`<option${g===c?" selected":""}>${esc(g)}</option>`).join("");if(!c&&gs[i])$(s).value=gs[i]});
 $("#pi").textContent=out.length?`Відповідей: ${out.length}${bad?`, пошкоджених кодів: ${bad}`:""}. Груп: ${gs.length}.`:"Даних ще немає."}
function lg(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let x=z,y=z,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gp(a,x){if(x<=0)return 0;let s=1/a,t=1/a;for(let n=1;n<300;n++){t*=x/(a+n);s+=t;if(t<s*1e-12)break}return s*Math.exp(-x+a*Math.log(x)-lg(a))}
function chi(a,b){const na=a.reduce((x,y)=>x+y,0),nb=b.reduce((x,y)=>x+y,0),N=na+nb;let x2=0,df=0,sm=0;for(let i=0;i<a.length;i++){const c=a[i]+b[i];if(!c)continue;df++;const ea=na*c/N,eb=nb*c/N;if(ea<5||eb<5)sm++;x2+=(a[i]-ea)**2/ea+(b[i]-eb)**2/eb}df=Math.max(1,df-1);return{x2,df,p:1-gp(df/2,x2/2),sm}}
const CR={1:3.84,2:5.99,3:7.81},dist=r=>{const d=[0,0,0,0];r.forEach(x=>d[LV(x.T)-1]++);return d},mean=(r,k)=>r.length?r.reduce((s,x)=>s+x[k],0)/r.length:0,pc=(x,n)=>n?f1(x/n*100):"-";
function analyze(){parse();const R=$("#rep");if(!ROWS.length){R.innerHTML=`<div class="card"><p class="lead">Даних ще немає.</p></div>`;return}const eg=$("#eg").value,kg=$("#kg").value;let h="",tsv=[];
 ["В","П"].forEach(st=>{const A=ROWS.filter(r=>String(r.g)===eg&&r.e===st),B=ROWS.filter(r=>String(r.g)===kg&&r.e===st);if(!A.length&&!B.length)return;const da=dist(A),db=dist(B),nm=st==="В"?"Перше проходження (констатувальний етап)":"Повторне проходження (контрольний етап)";
  let t=`<section class="card"><h2>${nm}</h2><div class="tbl"><table><tr><th rowspan="2">Рівень</th><th colspan="2">ЕГ (${esc(eg)}), n = ${A.length}</th><th colspan="2">КГ (${esc(kg)}), n = ${B.length}</th></tr><tr><th>осіб</th><th>%</th><th>осіб</th><th>%</th></tr>`;tsv.push(nm,"Рівень\tЕГ осіб\tЕГ %\tКГ осіб\tКГ %");
  for(let i=3;i>=0;i--){t+=`<tr><td>${LVN[i+1]}</td><td>${da[i]}</td><td>${pc(da[i],A.length)}</td><td>${db[i]}</td><td>${pc(db[i],B.length)}</td></tr>`;tsv.push([LVN[i+1],da[i],pc(da[i],A.length),db[i],pc(db[i],B.length)].join("\t"))}
  t+=`</table></div><div class="tbl"><table><tr><th>Критерій (макс. 25)</th><th>ЕГ</th><th>КГ</th></tr>`;tsv.push("","Критерій\tЕГ\tКГ");
  [["Мотиваційний","M"],["Когнітивний","C"],["Діяльнісний","D"],["Рефлексивний","R"],["Загальний (зі 100)","T"]].forEach(([n,k])=>{t+=`<tr><td>${n}</td><td>${f1(mean(A,k))}</td><td>${f1(mean(B,k))}</td></tr>`;tsv.push([n,f1(mean(A,k)),f1(mean(B,k))].join("\t"))});t+="</table></div>";
  if(A.length&&B.length){const c=chi(da,db),sg=c.x2>CR[c.df];t+=`<div class="verdict${sg?"":" no"}">χ²емп = ${f2(c.x2)}; χ²кр = ${f2(CR[c.df])} (α = 0,05; df = ${c.df}); p = ${c.p<.001?"< 0,001":f2(c.p)}. ${sg?"Відмінності між ЕГ і КГ статистично значущі.":"Статистично значущих відмінностей між ЕГ і КГ немає."}${c.sm?` <span class="hint">У ${c.sm} комірках очікувана частота менша за 5 - висновок орієнтовний.</span>`:""}</div>`;tsv.push("",`χ2емп = ${f2(c.x2)}; χ2кр = ${f2(CR[c.df])}; df = ${c.df}; p = ${f2(c.p)}`)}
  h+=t+chart(da,db,A.length,B.length)+"</section>";tsv.push("","")});
 const all=ROWS.filter(r=>r.q&&r.k);if(all.length){h+=`<section class="card"><h2>Частка правильних відповідей</h2><div class="tbl"><table><tr><th>Запитання</th><th>Правильно, %</th></tr>${KNOW.map((q,i)=>`<tr><td>З${i+1}. ${q[0]}</td><td>${f1(all.filter(r=>r.q[i]).length/all.length*100)}</td></tr>`).join("")}${ACT.map((q,i)=>`<tr><td>Д${i+1}. ${q[0]}</td><td>${f1(all.filter(r=>r.k[i]).length/all.length*100)}</td></tr>`).join("")}</table></div></section>`}
 h+=`<section class="card"><h2>Усі відповіді (анонімно)</h2><div class="tbl"><table><tr><th>Код</th><th>Група</th><th>Етап</th><th>М</th><th>К</th><th>Д</th><th>Р</th><th>Разом</th><th>Рівень</th></tr>${ROWS.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.g)}</td><td>${r.e}</td><td>${f1(r.M)}</td><td>${f1(r.C)}</td><td>${f1(r.D)}</td><td>${f1(r.R)}</td><td>${f1(r.T)}</td><td>${LVN[LV(r.T)]}</td></tr>`).join("")}</table></div><div class="nav"><span class="hint">Таблиці копіюються у форматі для Excel і Word.</span><button class="go" id="ct">Копіювати таблиці</button></div><textarea id="tsv" hidden></textarea></section>`;
 R.innerHTML=h;$("#tsv").value=tsv.join("\n");$("#ct").onclick=async()=>{try{await navigator.clipboard.writeText($("#tsv").value);$("#ct").textContent="Скопійовано"}catch(e){const t=$("#tsv");t.hidden=false;t.select()}}}
function chart(da,db,na,nb){const W=640,H=260,pl=44,pb=40,pt=20,cw=(W-pl-10)/4,pa=da.map(x=>na?x/na*100:0),pq=db.map(x=>nb?x/nb*100:0),mx=Math.max(50,...pa,...pq),y=v=>H-pb-(v/mx)*(H-pb-pt);
 let s=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Розподіл за рівнями, %">`;for(let v=0;v<=mx;v+=10)s+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#E4ECE0"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5D6B60">${v}%</text>`;
 for(let i=0;i<4;i++){const x=pl+i*cw+cw*.17,bw=cw*.3;s+=`<rect x="${x}" y="${y(pa[i])}" width="${bw}" height="${H-pb-y(pa[i])}" rx="4" fill="#23A019"/><rect x="${x+bw+5}" y="${y(pq[i])}" width="${bw}" height="${H-pb-y(pq[i])}" rx="4" fill="#F2C14E"/><text x="${pl+i*cw+cw/2}" y="${H-pb+22}" text-anchor="middle" font-size="12" fill="#152117">${LVN[i+1]}</text>`}
 return s+`<rect x="${W-160}" y="4" width="12" height="12" rx="3" fill="#23A019"/><text x="${W-142}" y="14" font-size="12">ЕГ</text><rect x="${W-100}" y="4" width="12" height="12" rx="3" fill="#F2C14E"/><text x="${W-82}" y="14" font-size="12">КГ</text></svg></div>`}
function bT(){const go2=async()=>{if(!ENDPOINT)return;$("#pi").textContent="Завантаження…";try{const j=await (await fetch(ENDPOINT+"?key="+encodeURIComponent($("#key").value))).json();if(j.error){$("#pi").textContent="Неправильний пароль.";return}SRV=j.rows||[];$("#sel").hidden=false;try{sessionStorage.setItem("ak",$("#key").value)}catch(e){}analyze();["#eg","#kg"].forEach(x=>$(x).onchange=analyze)}catch(e){$("#pi").textContent="Не вдалося завантажити відповіді."}};
 $("#ld").onclick=go2;$("#key").onkeydown=e=>{if(e.key==="Enter")go2()};try{const k=sessionStorage.getItem("ak");if(k){$("#key").value=k;go2()}}catch(e){}}
const V=[[v0,b0],[v1,b1],[v2,b2],[v3,b3],[v4,b4],[v5,b5],[v6,b6]];
function render(){if(location.hash==="#results"){$("#app").innerHTML=vT();bT();return}$("#app").innerHTML=V[S.step][0]();V[S.step][1]()}
addEventListener("hashchange",render);load();render();
