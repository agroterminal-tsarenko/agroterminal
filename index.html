<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Агро Опитувальник</title>
<meta name="description" content="Агро Опитувальник - анонімне опитування для студентів-аграріїв про цифрові технології в навчанні й майбутній професії">
<meta property="og:title" content="Агро Опитувальник">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="logo.png">
<link rel="preload" as="image" href="img/hero.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Макет: одна "картка-кадр" на питання - фото поля зверху, питання і великі плитки відповідей знизу; прогрес - трактор, що їде полем */
:root{
  --leaf:#23A019;--leaf-d:#166F0F;--leaf-dd:#0F3A0C;--sprout:#EAF7E5;--wheat:#F2C14E;--wheat-l:#FCF4DE;--sky:#EEF5F8;
  --ink:#142017;--muted:#5C6A5F;--line:#E0E9DB;--paper:#FFFFFF;--bg:#F4F7F1;--bad:#B9381F;
  --h:"Montserrat Alternates","Nunito",Arial,sans-serif;--b:"Nunito","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;font-family:var(--b);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-block:16px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:44px;height:auto}
.brand b{font-family:var(--h);font-size:19px;letter-spacing:-.3px;line-height:1}
.brand b span{color:var(--leaf)}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.anon{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--leaf-d);background:var(--sprout);border:1px solid #CDE9C5;border-radius:999px;padding:8px 14px;white-space:nowrap}
/* прогрес-поле */
.track{position:relative;height:30px;margin:2px 18px 0}
.track .soil{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:9px;background:repeating-linear-gradient(90deg,#E4D5B7 0 10px,#D9C59F 10px 12px)}
.track .grown{position:absolute;left:0;top:20px;height:6px;border-radius:9px;background:linear-gradient(90deg,#7CC95A,var(--leaf));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track img{position:absolute;top:-2px;width:34px;height:auto;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.tcount{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
/* герой */
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:430px;display:flex;align-items:flex-end;color:#fff;box-shadow:0 30px 60px -38px rgba(40,60,10,.7);isolation:isolate}
.hero .ph{position:absolute;inset:0;background:#4b5a24 url("img/hero.jpg") center 55%/cover no-repeat;z-index:-2;animation:kb 18s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,22,6,0) 20%,rgba(8,22,6,.35) 55%,rgba(8,22,6,.82) 100%)}
.hero .in{padding:32px;display:flex;flex-direction:column;gap:14px;max-width:600px}
.hero h1{font-family:var(--h);font-size:38px;line-height:1.08;margin:0;letter-spacing:-.8px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--wheat)}
.hero p{margin:0;font-size:17px;color:#EEF4E8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:13px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
/* картки */
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 22px 44px -34px rgba(20,32,23,.5)}
.card .body{padding:26px 28px 28px;display:flex;flex-direction:column;gap:18px}
.qimg{position:relative;aspect-ratio:16/7;overflow:hidden;background:#cfd8c4}
.qimg img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 14s ease-in-out infinite alternate}
.qimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.45))}
.qimg .tag{position:absolute;left:18px;bottom:14px;z-index:1;font-size:13px;font-weight:600;color:#fff;background:rgba(15,58,12,.55);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 12px;border-radius:999px}
.qimg .no{position:absolute;right:18px;bottom:12px;z-index:1;font-family:var(--h);font-size:28px;color:#fff;opacity:.9}
.qimg .no small{font-size:14px;opacity:.75}
h2{font-family:var(--h);font-size:23px;line-height:1.25;margin:0;letter-spacing:-.3px;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
.lbl{font-weight:600;font-size:14px;color:var(--muted)}
/* плитки */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles.one{grid-template-columns:1fr}
.tile{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:#FBFDF9;cursor:pointer;font:inherit;font-size:15.5px;font-weight:500;color:var(--ink);text-align:left;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.tile:hover{border-color:#B9DCAD;transform:translateY(-1px)}
.tile .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sprout);color:var(--leaf-d);transition:background .15s,color .15s}
.tile .ic svg{width:22px;height:22px}
.tile .ck{position:absolute;right:12px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tile[aria-pressed="true"]{border-color:var(--leaf);background:var(--sprout);box-shadow:0 8px 18px -12px rgba(35,160,25,.8)}
.tile[aria-pressed="true"] .ic{background:var(--leaf);color:#fff}
.tile[aria-pressed="true"] .ck{transform:scale(1)}
.tile.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(.96)}100%{transform:scale(1)}}
.tile.chip{min-height:48px;justify-content:center;font-weight:600}
/* шкала */
.scale{display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.bignum{display:flex;align-items:baseline;gap:12px}
.bignum b{font-family:var(--h);font-size:56px;line-height:1;color:var(--leaf);min-width:1.4ch;transition:transform .15s}
.bignum span{font-weight:600;font-size:17px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--leaf) var(--p,50%),#E5EDE1 var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--leaf);box-shadow:0 4px 12px rgba(0,0,0,.18);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--leaf);cursor:grab}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
/* матриця */
.mx{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:#FBFDF9}
.mrow .t{font-weight:600;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:600;padding:9px 6px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.seg button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
/* навігація */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
button.btn{font:inherit;font-weight:600;border-radius:14px;padding:13px 22px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:transform .12s,background .12s,opacity .15s}
button.btn:hover{transform:translateY(-1px)}
button.go{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 10px 20px -12px rgba(35,160,25,.9)}
button.go:hover{background:var(--leaf-d)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #A4DD93;outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
.err{margin:0;color:var(--bad);font-size:14px;min-height:1.2em}
/* анімація кадрів */
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.enter-back{animation:enterb .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes enterb{from{opacity:0;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
/* результат */
.res{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:170px;height:170px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-family:var(--h);font-size:38px;line-height:1}
.ring small{color:var(--muted)}
.persona{font-family:var(--h);font-size:22px;line-height:1.2;margin:0}
.bars{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:14px}
.trk{height:12px;background:#EEF3EB;border-radius:99px;overflow:hidden}
.trk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),#8BD35C);border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;font-size:13px}
.box{display:flex;gap:12px;align-items:center;background:var(--sprout);border:1px solid #CDE9C5;border-radius:16px;padding:14px 16px}
.idbox{font-family:var(--h);font-size:19px;letter-spacing:1px;color:var(--leaf-d)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* результати для дослідника */
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl th{background:#F5F9F2}
.verdict{border-left:5px solid var(--leaf);background:var(--sprout);padding:10px 14px;border-radius:0 12px 12px 0}
.verdict.no{border-color:#C99A1E;background:var(--wheat-l)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input[type=password],select{font:inherit;color:var(--ink);background:#FAFCF8;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.chart svg{width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#FAFCF8;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--h);font-size:24px}
.kpi span{font-size:13px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12.5px}
@media (max-width:620px){.hero{min-height:400px;border-radius:22px}.hero .in{padding:22px}.hero h1{font-size:28px}.card{border-radius:22px}.card .body{padding:20px}.tiles{grid-template-columns:1fr}.qimg{aspect-ratio:16/9}h2{font-size:20px}.res{grid-template-columns:1fr;justify-items:center;text-align:center}.br{grid-template-columns:96px 1fr 44px;text-align:left}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><img src="logo.png" alt="Логотип Агро Опитувальника"><div><b>Агро <span>Опитувальник</span></b><small>для студентів-аграріїв</small></div></a>
    <span class="anon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Анонімно</span>

  <div id="prog" hidden><div class="track"><div class="soil"></div><div class="grown" id="grown"></div><img id="trac" src="logo.png" alt=""></div><div class="tcount"><span id="ptag"></span><span id="pnum"></span></div></div>

</div>

  t+=`</table></div><div class="tbl"><table><tr><th>Критерій (макс. 25)</th><th>ЕГ</th><th>КГ</th></tr>`;tsv.push("","Критерій\tЕГ\tКГ");
  [["Мотиваційний","M"],["Когнітивний","C"],["Діяльнісний","D"],["Рефлексивний","R"],["Загальний (зі 100)","T"]].forEach(([n,k])=>{t+=`<tr><td>${n}</td><td>${f1(mean(A,k))}</td><td>${f1(mean(B,k))}</td></tr>`;tsv.push([n,f1(mean(A,k)),f1(mean(B,k))].join("\t"))});t+="</table></div>";
  if(A.length&&B.length){const c=chi(da,db),sg=c.x2>CR[c.df];t+=`<div class="verdict${sg?"":" no"}">χ²емп = ${f2(c.x2)}; χ²кр = ${f2(CR[c.df])} (α = 0,05; df = ${c.df}); p = ${c.p<.001?"< 0,001":f2(c.p)}. ${sg?"Відмінності між ЕГ і КГ статистично значущі.":"Статистично значущих відмінностей між ЕГ і КГ немає."}${c.sm?` <span class="hint">У ${c.sm} комірках очікувана частота менша за 5 - висновок орієнтовний.</span>`:""}</div>`;tsv.push("",`χ2емп = ${f2(c.x2)}; χ2кр = ${f2(CR[c.df])}; df = ${c.df}; p = ${f2(c.p)}`)}
  h+=t+chart(da,db,A.length,B.length)+"</div></section>";tsv.push("","")});
 h+=`<section class="card"><div class="body"><h2>Відповіді на запитання</h2>${Q.filter(q=>q.type==="choice").map(q=>{const n=ROWS.length;return `<div class="tbl"><table><tr><th>${esc(q.t)}</th><th>%</th></tr>${q.o.map((o,j)=>`<tr><td>${o[0]}</td><td>${pc(ROWS.filter(r=>r.a&&r.a[q.id]===j).length,n)}</td></tr>`).join("")}</table></div>`}).join("")}</div></section>`;
 h+=`<section class="card"><div class="body"><h2>Усі відповіді (анонімно)</h2><div class="tbl"><table><tr><th>Код</th><th>Група</th><th>Етап</th><th>Вік</th><th>Стать</th><th>М</th><th>К</th><th>Д</th><th>Р</th><th>Разом</th></tr>${ROWS.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.g)}</td><td>${r.e}</td><td>${esc(r.age)}</td><td>${esc(r.sex)}</td><td>${f1(r.M)}</td><td>${f1(r.C)}</td><td>${f1(r.D)}</td><td>${f1(r.R)}</td><td>${f1(r.T)}</td></tr>`).join("")}</table></div><div class="nav"><span class="hint">Таблиці копіюються у форматі для Excel і Word.</span><button class="btn go" id="ct">Копіювати таблиці</button></div><textarea id="tsv" hidden></textarea></div></section>`;
 R.innerHTML=h;$("#tsv").value=tsv.join("\n");$("#ct").onclick=async()=>{try{await navigator.clipboard.writeText($("#tsv").value);$("#ct").textContent="Скопійовано"}catch(e){const t=$("#tsv");t.hidden=false;t.select()}};["#eg","#kg"].forEach(x=>$(x).onchange=analyze)}
function chart(da,db,na,nb){const W=640,H=260,pl=44,pb=40,pt=20,cw=(W-pl-10)/4,pa=da.map(x=>na?x/na*100:0),pq=db.map(x=>nb?x/nb*100:0),mx=Math.max(50,...pa,...pq),y=v=>H-pb-(v/mx)*(H-pb-pt);
 let s=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Розподіл за рівнями, %">`;for(let v=0;v<=mx;v+=10)s+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#E4ECE0"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5C6A5F">${v}%</text>`;
 for(let i=0;i<4;i++){const x=pl+i*cw+cw*.17,bw=cw*.3;s+=`<rect x="${x}" y="${y(pa[i])}" width="${bw}" height="${H-pb-y(pa[i])}" rx="4" fill="#23A019"/><rect x="${x+bw+5}" y="${y(pq[i])}" width="${bw}" height="${H-pb-y(pq[i])}" rx="4" fill="#F2C14E"/><text x="${pl+i*cw+cw/2}" y="${H-pb+22}" text-anchor="middle" font-size="12" fill="#142017">${LVN[i+1]}</text>`}
 return s+`<rect x="${W-160}" y="4" width="12" height="12" rx="3" fill="#23A019"/><text x="${W-142}" y="14" font-size="12">ЕГ</text><rect x="${W-100}" y="4" width="12" height="12" rx="3" fill="#F2C14E"/><text x="${W-82}" y="14" font-size="12">КГ</text></svg></div>`}
function bR(){const go2=async()=>{if(!ENDPOINT)return;$("#pi").textContent="Завантаження…";try{const j=await (await fetch(ENDPOINT+"?key="+encodeURIComponent($("#key").value))).json();if(j.error){$("#pi").textContent="Неправильний пароль.";return}ROWS=j.rows||[];$("#sel").hidden=false;$("#pi").textContent="Готово.";try{sessionStorage.setItem("ak",$("#key").value)}catch(e){}analyze()}catch(e){$("#pi").textContent="Не вдалося завантажити відповіді."}};
 $("#ld").onclick=go2;$("#key").onkeydown=e=>{if(e.key==="Enter")go2()};try{const k=sessionStorage.getItem("ak");if(k){$("#key").value=k;go2()}}catch(e){}}

/* ---- рендер ---- */
function render(){const res=location.hash==="#results";$("#prog").hidden=res||S.step<0||S.step>=Q.length||isDone();
 if(res){$("#app").innerHTML=vR();bR();return}
 if(S.step>=Q.length){$("#app").innerHTML=vDone();bDone();return}
 if(S.step<0){$("#app").innerHTML=vStart();bStart();return}
 const k=S.step/(Q.length-1);$("#grown").style.width=(k*100)+"%";$("#trac").style.left=`${k*100}%`;$("#ptag").textContent=Q[S.step].tag;$("#pnum").textContent=`${S.step+1} з ${Q.length}`;
 $("#app").innerHTML=vQ(S.step);bQ(S.step)}
addEventListener("hashchange",render);load();render();
</script>
</body>
